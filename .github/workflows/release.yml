name: "release"

permissions:
  contents: write

on:
  push:
    branches:
      - "main"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Modules
        run: npm ci
        working-directory: ./ui

      - name: Build Application
        run: npm run build
        working-directory: ./ui

      - name: Package resource
        run: zip -r bcc-chat.zip fxmanifest.lua README.md version config.lua shared locale client server ui/dist

      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main
        with:
          path: ui

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.package-version.outputs.current-version }}"
          prerelease: false
          title: "Release ${{ steps.package-version.outputs.current-version }}"
          files: |
            bcc-chat.zip
